name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run test suite
        run: |
          cd sentinel-bridge
          python -m pytest test_bridge.py -v

  pester:
    name: pester (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: ${{ matrix.shell }}
        run: Install-Module -Name Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run sentinel.ps1 test suite
        shell: ${{ matrix.shell }}
        run: Invoke-Pester -Path ./sentinel.Tests.ps1 -Output Detailed -CI
