name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      # The bridge runs on Linux, so every test file runs there, with coverage.
      # (__main__ runs in a subprocess in test_e2e.py and is not counted.)
      - name: Run test suite
        if: runner.os == 'Linux'
        run: |
          cd sentinel-bridge
          python -m pytest -v --cov=bridge --cov-report=term-missing:skip-covered

      # The client and the people developing the bridge are on Windows. The
      # deployment-script tests need a bash that is not a WSL stub, so they are
      # left to the Linux job.
      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        run: |
          cd sentinel-bridge
          python -m pytest -v test_bridge.py test_e2e.py test_audit_regressions.py

  pester-windows-powershell:
    name: pester (powershell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester
        shell: powershell
        # The PowerShell Gallery sometimes answers "No match was found" for a
        # module that exists; one such answer failed an unrelated pull request.
        run: |
          $installed = $false
          foreach ($attempt in 1..3) {
            try {
              Install-Module -Name Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              $installed = $true
              break
            }
            catch {
              Write-Host "Install-Module attempt $attempt failed: $_"
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $installed) { exit 1 }

      - name: Run sentinel.ps1 test suite
        shell: powershell
        run: Invoke-Pester -Path ./sentinel.Tests.ps1 -Output Detailed -CI

  pester-powershell-core:
    name: pester (pwsh)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        # The PowerShell Gallery sometimes answers "No match was found" for a
        # module that exists; one such answer failed an unrelated pull request.
        run: |
          $installed = $false
          foreach ($attempt in 1..3) {
            try {
              Install-Module -Name Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              $installed = $true
              break
            }
            catch {
              Write-Host "Install-Module attempt $attempt failed: $_"
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $installed) { exit 1 }

      - name: Run sentinel.ps1 test suite
        shell: pwsh
        run: Invoke-Pester -Path ./sentinel.Tests.ps1 -Output Detailed -CI

  pester-posix-token:
    name: pester (Linux token storage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($attempt in 1..3) {
            try {
              Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }

      - name: Run native POSIX token regressions
        shell: pwsh
        run: Invoke-Pester -Path ./sentinel.Tests.ps1 -FullNameFilter 'login*','POSIX token storage*','token transaction recovery*' -Output Detailed -CI
